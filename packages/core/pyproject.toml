[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bounded-embodiment"
version = "0.1.0.dev0"
description = "The Bounded Embodiment test method, executable: canonical JSON, signing, envelopes, the hostile command generator, scoring and report verification."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Craig Merry" }]
dependencies = ["jsonschema>=4.18", "cryptography>=42"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
be = "bounded_embodiment.cli:main"
bounded-embodiment = "bounded_embodiment.cli:main"

[project.urls]
Repository = "https://github.com/RobotRegistryFoundation/bounded-embodiment"

[tool.hatch.build.targets.wheel]
packages = ["src/bounded_embodiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
