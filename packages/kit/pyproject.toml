[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bounded-embodiment-kit"
version = "0.1.2"
description = "The lab bench for the Bounded Embodiment tests: adapters, instruments, the runner and its watchdog."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt"]
authors = [{ name = "Craig Merry" }]
dependencies = ["bounded-embodiment~=0.1.0", "numpy>=1.24"]
keywords = ["robotics", "safety", "testing", "embodied AI", "test bench", "LeRobot", "OAK-D"]
# CI tests the kit on Python 3.12 and 3.13 only (the lerobot extra needs 3.12 or later).
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.9,<4.14"]
oakd = ["depthai>=2.24,<3", "opencv-python-headless>=4.9,<4.14"]
fit = ["opencv-python-headless>=4.9,<4.14", "scipy>=1.10"]
lerobot = ["lerobot>=0.6.1", "pyserial>=3.5"]
test = ["pytest>=8"]

[project.entry-points."bounded_embodiment.cli"]
kit = "bounded_embodiment_kit.cli:register"

[project.urls]
Homepage = "https://craigmerry.com/bounded-embodiment/"
Documentation = "https://github.com/RobotRegistryFoundation/bounded-embodiment/blob/main/docs/lab-guide.md"
Requirements = "https://github.com/RobotRegistryFoundation/bounded-embodiment/blob/main/docs/requirements.md"
Method = "https://github.com/RobotRegistryFoundation/bounded-embodiment/blob/main/method/bounded-embodiment-method-v0.1.md"
Source = "https://github.com/RobotRegistryFoundation/bounded-embodiment"
Issues = "https://github.com/RobotRegistryFoundation/bounded-embodiment/issues"
Changelog = "https://github.com/RobotRegistryFoundation/bounded-embodiment/blob/main/CHANGELOG.md"
Results = "https://robotregistryfoundation.org/bounded-embodiment/results/"

[tool.hatch.build.targets.wheel]
packages = ["src/bounded_embodiment_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: renders synthetic recordings and fits them end to end, and runs the B6 matrix's 10-minute cases (about ten minutes on two cores); -m 'not slow' leaves them out",
]
